<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>
    <h1>Tasks</h1>
    <form method="POST" action="{{ url_for('routes.create_task') }}">
        <input type="text" name="description" placeholder="New Task" required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                {{ task.description }}
                {% if not task.done %}
                    <form method="POST" action="{{ url_for('routes.mark_done', task_id=loop.index0) }}" style="display:inline;">
                        <button type="submit">Mark Done</button>
                    </form>
                {% else %}
                    <strong>(Done)</strong>
                {% endif %}
                <form method="POST" action="{{ url_for('routes.delete_task', task_id=loop.index0) }}" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
